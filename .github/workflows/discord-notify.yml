name: Discord 프로젝트 알림

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 프로젝트 알림 전송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)
          kind = os.environ["GITHUB_EVENT_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          actor = os.environ["GITHUB_ACTOR"]
          actor_name = "재영" if actor == "PerfumesYung" else actor + "님"
          base = "https://github.com/" + repo
          fields = [{"name": "작업자", "value": actor_name, "inline": True}]
          title, color, description, url = "💿 Record Team · 연결 테스트", 5793266, "GitHub 알림이 정상적으로 연결되었습니다.", base
          if kind == "push":
              branch = event.get("ref", "").removeprefix("refs/heads/")
              fields.append({"name": "브랜치", "value": branch[:1024] or "확인 필요", "inline": True})
              commits = event.get("commits", [])
              title = "💿 Record Team · 코드 업데이트"
              color = 3447003
              if event.get("deleted"):
                  title = "💿 Record Team · 브랜치 삭제"
                  description = "브랜치가 삭제되었습니다."
              elif not commits:
                  description = "브랜치가 생성되거나 업데이트되었습니다."
              else:
                  lines = []
                  for commit in commits[-5:]:
                      message = commit.get("message", "").splitlines()[0] if commit.get("message") else "(메시지 없음)"
                      lines.append("• " + message[:240])
                  description = "\n".join(lines)
                  if len(commits) > 5:
                      description += "\n외 " + str(len(commits) - 5) + "개 커밋"
              url = event.get("compare") or base
          elif kind == "pull_request":
              pr = event["pull_request"]
              action = event.get("action")
              merged = pr.get("merged", False)
              if action == "closed":
                  title = "✅ Record Team · 병합 완료" if merged else "📁 Record Team · PR 종료"
                  color = 3066993 if merged else 9807270
              elif action == "synchronize":
                  title, color = "🔄 Record Team · PR 업데이트", 3447003
              else:
                  title, color = "🔍 Record Team · 검토 요청", 16705372
              description = "#" + str(pr["number"]) + " " + pr["title"][:500]
              fields.append({"name": "브랜치", "value": (pr["head"]["ref"] + " → " + pr["base"]["ref"])[:1024], "inline": True})
              url = pr["html_url"]
          
          payload = {
              "username": "Record Team · GitHub",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": title,
                  "description": description[:3500],
                  "url": url,
                  "color": color,
                  "fields": fields,
                  "footer": {"text": repo},
                  "timestamp": datetime.now(timezone.utc).isoformat(),
              }],
          }
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip().removesuffix("/github").rstrip("/")
          if not webhook:
              print("::notice::DISCORD_WEBHOOK_URL이 없어 알림을 건너뜁니다.")
          else:
              request = urllib.request.Request(
                  webhook, data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json", "User-Agent": "RecordTeam-GitHub"}, method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      print("Discord 알림 전송 완료:", response.status)
              except urllib.error.HTTPError as error:
                  print("::error::Discord 전송 실패. HTTP 상태:", error.code)
                  raise SystemExit(1)
              except urllib.error.URLError:
                  print("::error::Discord 연결 실패")
                  raise SystemExit(1)
          
          PY
